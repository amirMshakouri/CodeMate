<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>بازیابی رمز عبور — CodeMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <div class="auth-shell">
        <div class="auth-brand">
            <div class="wordmark">Code<span>Mate</span></div>
            <div>
                <h1>گاهی رمز یادت می‌ره، طبیعیه.</h1>
                <p class="lede">ایمیل حسابت رو بده، یک کد بازیابی برات می‌فرستیم.</p>
            </div>
        </div>

        <div class="auth-form-side">
            <div class="auth-form-wrap">
                <h2>فراموشی رمز عبور</h2>
                <p class="subhead">اگه این ایمیل حساب داشته باشه، کد بازیابی رو براش می‌فرستیم.</p>

                <div id="banner" class="banner banner-error"></div>

                <form id="forgot-form" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="email">ایمیل</label>
                        <input type="email" class="form-control" id="email" autocomplete="email" required>
                        <div class="field-error" data-for="email"></div>
                    </div>
                    <button type="submit" class="btn btn-brand w-100" id="submit-btn">ارسال کد بازیابی</button>
                </form>

                <p class="mt-4 text-center" style="font-size:0.9rem; color:var(--muted);">
                    کد رو داری؟ <a href="reset-password.html">تنظیم رمز جدید</a><br>
                    <a href="login.html">بازگشت به صفحه ورود</a>
                </p>
            </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/form-helpers.js"></script>
    <script src="assets/js/forgot-password.js"></script>
</body>
</html>
