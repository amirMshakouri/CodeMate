<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ورود — CodeMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <div class="auth-shell">
        <div class="auth-brand">
            <div class="wordmark">Code<span>Mate</span></div>
            <div>
                <h1>Build with the right teammates.</h1>
                <p class="lede">با مهارت‌هات تیم تشکیل بده و کارها رو یک‌جا پیگیری کن.</p>
                <svg class="node-graphic" viewBox="0 0 360 180" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <line x1="40" y1="130" x2="150" y2="60" stroke="#33363d" stroke-width="1.5" />
                    <line x1="150" y1="60" x2="270" y2="90" stroke="#33363d" stroke-width="1.5" />
                    <line x1="150" y1="60" x2="120" y2="150" stroke="#33363d" stroke-width="1.5" />
                    <line x1="270" y1="90" x2="320" y2="40" stroke="#33363d" stroke-width="1.5" />
                    <line x1="270" y1="90" x2="230" y2="155" stroke="#33363d" stroke-width="1.5" />
                    <circle cx="40" cy="130" r="6" fill="#5b57d6" />
                    <circle cx="150" cy="60" r="7" fill="#2f8f6b" />
                    <circle cx="270" cy="90" r="6" fill="#5b57d6" />
                    <circle cx="120" cy="150" r="5" fill="#3a3d44" />
                    <circle cx="320" cy="40" r="5" fill="#3a3d44" />
                    <circle cx="230" cy="155" r="5" fill="#3a3d44" />
                </svg>
            </div>
        </div>

        <div class="auth-form-side">
            <div class="auth-form-wrap">
                <h2>ورود</h2>
                <p class="subhead">خوش اومدی — اطلاعاتت رو وارد کن.</p>

                <div id="banner" class="banner banner-error"></div>

                <form id="login-form" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="userNameOrEmail">نام کاربری یا ایمیل</label>
                        <input type="text" class="form-control" id="userNameOrEmail" autocomplete="username" required>
                        <div class="field-error" data-for="userNameOrEmail"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="password">رمز عبور</label>
                        <input type="password" class="form-control" id="password" autocomplete="current-password" required>
                        <div class="field-error" data-for="password"></div>
                    </div>
                    <div class="mb-3 text-end">
                        <a href="forgot-password.html" style="font-size:0.85rem;">رمز عبور رو فراموش کردی؟</a>
                    </div>
                    <button type="submit" class="btn btn-brand w-100" id="submit-btn">ورود</button>
                </form>

                <p class="mt-4 text-center" style="font-size:0.9rem; color:var(--muted);">
                    حساب نداری؟ <a href="register.html">ثبت‌نام کن</a>
                </p>
            </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/form-helpers.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
