<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تنظیم رمز جدید — CodeMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <div class="auth-shell">
        <div class="auth-brand">
            <div class="wordmark">Code<span>Mate</span></div>
            <div>
                <h1>یک قدم مونده.</h1>
                <p class="lede">کدی که ایمیل شده رو وارد کن، همراه با رمز عبور جدید.</p>
            </div>
        </div>

        <div class="auth-form-side">
            <div class="auth-form-wrap">
                <h2>تنظیم رمز جدید</h2>
                <p class="subhead">کد ۱۵ دقیقه بعد از ارسال منقضی می‌شه.</p>

                <div id="banner" class="banner banner-error"></div>

                <form id="reset-form" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="email">ایمیل</label>
                        <input type="email" class="form-control" id="email" autocomplete="email" required>
                        <div class="field-error" data-for="email"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="token">کد بازیابی</label>
                        <input type="text" class="form-control" id="token" inputmode="numeric" required>
                        <div class="field-error" data-for="token"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="newPassword">رمز عبور جدید</label>
                        <input type="password" class="form-control" id="newPassword" autocomplete="new-password" required>
                        <div class="field-error" data-for="newPassword"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="confirmNewPassword">تکرار رمز عبور جدید</label>
                        <input type="password" class="form-control" id="confirmNewPassword" autocomplete="new-password" required>
                        <div class="field-error" data-for="confirmNewPassword"></div>
                    </div>
                    <button type="submit" class="btn btn-brand w-100" id="submit-btn">تنظیم رمز عبور</button>
                </form>

                <p class="mt-4 text-center" style="font-size:0.9rem; color:var(--muted);">
                    <a href="login.html">بازگشت به صفحه ورود</a>
                </p>
            </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/form-helpers.js"></script>
    <script src="assets/js/reset-password.js"></script>
</body>
</html>
